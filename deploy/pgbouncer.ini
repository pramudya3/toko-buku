;; pgbouncer.ini — untuk VPS 2vCPU/2GB toko online 1000 baca concurrent
;; Letak di server: /etc/pgbouncer/pgbouncer.ini
;; Pool transaction: hemat 2GB, 1000 client → 20 conn asli ke PG

[databases]
; Ganti host/port/dbname sesuai .env DB_HOST/DB_DATABASE (default toko_buku di 127.0.0.1:5432)
toko_buku = host=127.0.0.1 port=5432 dbname=toko_buku

[pgbouncer]
listen_port = 6439
listen_addr = 127.0.0.1
auth_type = md5
auth_file = /etc/pgbouncer/userlist.txt

; 1000 concurrent baca artikel/toko → 1000 client conn, tapi hanya 20 ke PG (2GB aman)
pool_mode = transaction
max_client_conn = 1000
default_pool_size = 20
reserve_pool_size = 5
reserve_pool_timeout = 2
max_db_connections = 25
max_user_connections = 25

; Timeout & log
server_reset_query = DISCARD ALL
server_check_delay = 30
server_check_query = select 1
log_connections = 0
log_disconnections = 0

[users]
; Isi via: echo '"toko_buku" "md5'$(echo -n "toko_buku_password" | md5sum | cut -d" " -f1)'"' > /etc/pgbouncer/userlist.txt

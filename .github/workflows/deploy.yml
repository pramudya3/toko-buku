name: deploy

on:
  push:
    branches:
      - penerbit-pcp

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to production
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          timeout: 10m
          command_timeout: 10m
          script: |
            set -e
            export PATH="/home/ubuntu/.nvm/versions/node/v24.19.0/bin:$PATH"
            if [ -f "$HOME/.nvm/nvm.sh" ]; then source "$HOME/.nvm/nvm.sh"; nvm use 24 || true; fi
            echo "=== deploy start $(date -u +%FT%TZ) ==="
            echo "node=$(node -v 2>&1) npm=$(npm -v 2>&1) php=$(php -v | head -1)"
            cd /var/www/toko-buku-vue
            git fetch origin penerbit-pcp
            git reset --hard origin/penerbit-pcp
            git clean -fd || true
            sudo chown -R ubuntu:ubuntu public/build storage bootstrap/cache 2>/dev/null || true
            [ -d node_modules ] && sudo chown -R ubuntu:ubuntu node_modules 2>/dev/null || true
            # Bersihkan cache lama agar wayfinder melihat route terbaru (optimize:clear bisa gagal di cache redis → fallback ke clear spesifik)
            php artisan optimize:clear || true
            php artisan route:clear || true
            php artisan config:clear || true
            php artisan view:clear || true
            php artisan event:clear || true
            composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader
            # Bersihkan lagi setelah composer install (package:discover bisa cache)
            php artisan route:clear || true
            php artisan config:clear || true
            php artisan wayfinder:generate --with-form
            echo "=== wayfinder check ==="
            ls resources/js/routes/google 2>&1 | head -20
            test -f resources/js/routes/google/index.ts && echo "✓ google route generated" || (echo "✗ google route missing! wayfinder gagal" && exit 1)
            echo "=== npm install (include dev for vite/typescript) ==="
            cat .npmrc 2>&1 | head -20 || echo "no .npmrc"
            npm config get omit 2>&1 | head -5 || true
            npm config get production 2>&1 | head -5 || true
            # Pastikan devDependencies terinstall (typescript, @tailwindcss/typography) — NODE_ENV=production bisa omit dev
            NODE_ENV=development npm ci --no-audit --no-fund --include=dev 2>&1 | tail -n 30
            echo "=== npm verify ==="
            ls node_modules/typescript 2>&1 | head -5 && echo "✓ typescript present" || (echo "✗ typescript missing" && ls node_modules 2>&1 | head -20)
            ls node_modules/@tailwindcss/typography 2>&1 | head -5 && echo "✓ typography present" || echo "✗ typography missing"
            ls node_modules/vite 2>&1 | head -5 && echo "✓ vite present" || echo "✗ vite missing"
            npm run build
            echo "=== vite manifest check ==="
            ls -lh public/build/manifest.json 2>&1 | head -5 || ls -lh public/build/.vite/manifest.json 2>&1 | head -5 || true
            grep -q "AlasanRetur" public/build/manifest.json 2>&1 && echo "✓ AlasanRetur found in manifest" || grep -q "AlasanRetur" public/build/.vite/manifest.json 2>&1 && echo "✓ AlasanRetur found in .vite/manifest" || echo "⚠ AlasanRetur NOT in manifest — build may be stale"
            php artisan migrate --force
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan event:cache
            sudo systemctl restart penerbitpcp
            sudo systemctl restart penerbitpcp-worker 2>&1 || echo "worker restart skipped"
            echo "=== deploy done ==="
